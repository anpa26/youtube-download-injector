<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4B2B" />
      <stop offset="100%" style="stop-color:#FF416C" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE" />
      <stop offset="100%" style="stop-color:#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#0F0F1A" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.3" />
  
  <!-- Play/Download Icon -->
  <g transform="translate(16, 16)" filter="url(#glow)">
    <!-- Play button shape outline -->
    <path d="M 24,16 L 80,48 L 24,80 Z" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linejoin="round" />
    <!-- Downward Download Arrow -->
    <path d="M 52,24 L 52,56 M 40,48 L 52,60 L 64,48" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
